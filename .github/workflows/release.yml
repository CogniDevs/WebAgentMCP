name: Release WebAgentMCP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-daemon:
    name: Build Daemon (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: webagentmcp-daemon-windows.exe
            binary_path: daemon/target/release/webagentmcp-daemon.exe
            archive_name: webagentmcp-daemon-windows.zip
          - os: ubuntu-latest
            artifact_name: webagentmcp-daemon-linux
            binary_path: daemon/target/release/webagentmcp-daemon
            archive_name: webagentmcp-daemon-linux.tar.gz
          - os: macos-latest
            artifact_name: webagentmcp-daemon-macos
            binary_path: daemon/target/release/webagentmcp-daemon
            archive_name: webagentmcp-daemon-macos.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        shell: bash
        run: |
          cd daemon
          cargo build --release

      - name: Package Windows archive
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path ${{ matrix.binary_path }} -DestinationPath ${{ matrix.archive_name }} -Force

      - name: Package Unix archive
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          tar -czvf ${{ matrix.archive_name }} -C daemon/target/release webagentmcp-daemon

      - name: Upload daemon artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

  package-extension:
    name: Package Chrome Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create extension zip archive
        run: |
          cd extension
          zip -r ../webagentmcp-extension.zip .

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: webagentmcp-extension.zip
          path: webagentmcp-extension.zip

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-daemon, package-extension]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}